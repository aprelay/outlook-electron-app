<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Outlook Portal</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="portal-layout">
      <section class="feature-side">
        <div class="features">
          <button class="feature-card" id="browser-sessions">
            <span class="feature-icon">O</span>
            <strong>Browser Sessions</strong>
            <span>Launch your authenticated Outlook Web session in its own secure window.</span>
          </button>
          <button class="feature-card" id="token-dashboard">
            <span class="feature-icon">T</span>
            <strong>Token Dashboard</strong>
            <span>Open the separate device-code and Microsoft session manager.</span>
          </button>
          <button class="feature-card" id="admin-center">
            <span class="feature-icon">A</span>
            <strong>Admin Panel</strong>
            <span>Open the official Microsoft 365 admin center in your browser.</span>
          </button>
        </div>
      </section>

      <section class="connect-side">
        <form id="connection-form" class="connect-panel">
          <div class="portal-icon">P</div>
          <h1>Portal</h1>
          <p>Welcome back</p>

          <label>Server URL<input id="server-url" type="url" placeholder="https://your-server.pages.dev" required /></label>
          <label>Access key<input id="access-key" type="password" placeholder="Enter your portal access key" /></label>
          <button type="submit" class="connect-button">Connect portal server</button>
          <div class="divider"><span>or</span></div>
          <div class="device-fields">
            <label>Microsoft client ID<input id="device-client-id" placeholder="Application (client) ID" /></label>
            <label>Tenant<input id="device-tenant" value="organizations" /></label>
          </div>
          <button id="device-sign-in" type="button" class="device-button">Sign in with device code</button>
          <div class="secure-status"><span></span><strong id="storage-label">Checking secure storage</strong></div>
          <p id="connection-message" class="message" role="status"></p>
        </form>
      </section>
    </main>

    <div id="device-modal" class="modal" hidden>
      <section class="modal-card">
        <p class="modal-kicker">Microsoft device code</p>
        <h2>Complete sign-in</h2>
        <p id="device-message"></p>
        <code id="device-code"></code>
        <div class="modal-actions"><button id="copy-device-code" type="button">Copy code</button><button id="open-device-login" type="button" class="device-button">Open Microsoft sign-in</button></div>
        <p class="modal-note">Only the user-facing code is displayed. Private device and account tokens never reach this page.</p>
      </section>
    </div>
    <script src="../portal-renderer.js"></script>
  </body>
</html>
